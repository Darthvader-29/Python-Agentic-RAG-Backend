[project]
name = "agentic-rag-backend"
version = "1.0.0"
description = "Multi-agent RAG backend (FastAPI, Pinecone, S3, Gemini)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi", "uvicorn", "python-multipart",
    "pydantic", "pydantic-settings",
    "python-dotenv", "structlog",
    "google-generativeai", "pinecone", "boto3", "httpx",
    "requests",
    "huggingface_hub", "numpy",
    "langchain-text-splitters", "langgraph", "openai", "tenacity",
    "python-docx",
    "pymupdf",
    "duckduckgo-search",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov", "pre-commit"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["F401", "F811", "B017"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["integrations.uploadthing.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# pydantic-settings: mypy doesn't understand that Settings() reads from env — false positive
module = ["config"]
ignore_errors = true

[[tool.mypy.overrides]]
# structlog processor signature not fully typed in stubs — tech debt: fix in Phase 7
module = ["logging_config"]
ignore_errors = true

[[tool.mypy.overrides]]
# google-generativeai stubs are incomplete (GenerationConfigDict not typed) — tech debt
module = ["components.generation"]
ignore_errors = true

[[tool.mypy.overrides]]
# FastAPI exception handler overload + UploadFile.filename nullability — tech debt
module = ["app"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
# Coverage baseline: 36 (Phase 0, measured 2026-05-29). Ratchet upward only.
addopts = "-q --cov-fail-under=36"

[tool.coverage.run]
branch = true
source = ["app", "config", "exceptions", "logging_config", "components", "database", "integrations"]
omit = ["test/*", "integrations/uploadthing/*"]

[tool.coverage.report]
show_missing = true
